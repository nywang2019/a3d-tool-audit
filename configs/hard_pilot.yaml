    - knapsack
    - coin_change
    - edit_distance
    - interval_scheduling
  datapoints_per_task: 5
  list_sizes: [8]
  folds: 1
  seed: 20261029
  temperature: 0.0
  top_p: 1.0
  max_tokens: 32768
  range_min: 1
  range_max: 100

models:
